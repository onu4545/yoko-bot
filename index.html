<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小沼陽子AIbot｜不登校の親のための内省コーチ</title>
<style>
  :root{
    --bg:#faf6f0; --card:#ffffff; --ink:#3a3330; --ink-soft:#6b625b;
    --accent:#b4694e; --accent-ink:#ffffff; --line:#e9e0d6;
    --you:#efe7dd; --bot:#fbf7f2;
    --radius:16px; --maxw:620px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#1c1917; --card:#26221f; --ink:#ece5dc; --ink-soft:#a89e94;
      --accent:#dd9077; --accent-ink:#241a15; --line:#3a332e;
      --you:#332d28; --bot:#221e1b;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.9; font-size:16.5px; -webkit-text-size-adjust:100%;
  }
  header.bar{max-width:var(--maxw);margin:0 auto;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px 14px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:15px;letter-spacing:.02em}
  .bar-links{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
  .safety-link{font-size:12.5px;color:var(--accent);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-family:inherit;white-space:nowrap}
  #app{max-width:var(--maxw);margin:0 auto;padding:16px 16px 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  h1{font-size:21px;line-height:1.6;margin:.2em 0 .6em}
  h2{font-size:17px;margin:1.4em 0 .5em}
  p{margin:.7em 0}
  .lead{color:var(--ink-soft)}
  .btn{display:inline-block;font:inherit;font-weight:600;border-radius:999px;padding:12px 22px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:center}
  .btn.secondary{background:transparent;color:var(--accent)}
  .btn.block{display:block;width:100%;margin:8px 0}
  .btn:active{transform:translateY(1px)}
  .choices .btn{background:var(--card);color:var(--ink);border-color:var(--line);text-align:left;font-weight:500;line-height:1.6;padding:14px 16px}
  .choices .btn:hover{border-color:var(--accent)}
  .bubble{border-radius:14px;padding:13px 16px;margin:10px 0;max-width:90%;white-space:pre-wrap}
  .bubble.you{background:var(--you);margin-left:auto;border-bottom-right-radius:4px}
  .bubble.bot{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px}
  .who{font-size:12px;color:var(--ink-soft);margin:16px 0 -2px}
  .fade{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}
  textarea{width:100%;min-height:110px;font:inherit;line-height:1.8;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  .note{font-size:13px;color:var(--ink-soft)}
  .step-dots{font-size:12px;color:var(--ink-soft);letter-spacing:.35em;margin-top:4px}
  .model-stage{border-left:3px solid var(--accent);padding:2px 0 2px 14px;margin:18px 0}
  .model-stage .n{font-weight:700;color:var(--accent)}
  .model-stage .k{font-size:13px;color:var(--ink-soft)}
  .res{margin:12px 0;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .res .name{font-weight:700}
  .res .contact{font-size:19px;letter-spacing:.02em;font-weight:700}
  footer.disc{max-width:var(--maxw);margin:8px auto 34px;padding:0 16px;font-size:12px;color:var(--ink-soft)}
  a{color:var(--accent)}
</style>
</head>
<body>
<header class="bar">
  <span class="brand">小沼陽子AIbot</span>
  <nav class="bar-links">
    <button class="safety-link" id="utownLink" onclick="go('utown')"></button>
    <button class="safety-link" id="modelLink" onclick="go('model')"></button>
  </nav>
</header>
<div id="app"></div>
<footer class="disc" id="disc"></footer>

<script>
/* =============================================================================

   ・相談の種類を足したいとき … concerns の [ ] の中に { } ブロックを1つ足す
   ・危機ワードを足したいとき … crisis.triggerWords に単語を足す
   ・相談窓口の番号を直したいとき … crisis.resources を編集
   ・フィードバック先を入れるとき … closing.feedbackContact を書き換え

   ※応答の順序は「受け止め → 感情の言語化 → ビリーフの仮説 → 別の見方 →

        emotion:"いまのあなたは、「自分を整えたい」という願いと、「でも現実はそう簡単じゃない」という事情の間で、揺れているのかもしれません。",
        belief:"この二つは、どちらかを選ばなければいけないものではないと思います。お金の心配は、気合いで脇に置けるものではありません。だからこそ、いったん切り離して考えてみたいのです。",
        reframe:"もし、お金の心配がひとまずなかったとしたら——あなたは本当はどうしたいですか。仕事を減らしたい、そばにいたい、自分の時間がほしい。そこで出てくるものが、あなたの「本当の望み」です。事情と望みを分けてみると、今できる小さな工夫が見えてくることがあります。",
        action:"いま出てきた「本当はこうしたい」を、うんと小さくしてみるとしたら——今日、少しだけできそうなことは、ありますか。"
      }
    }
  ],

  /* 自由記述で、どの相談にも当てはまらなかったときのフロー */
  generic:{
    steps:{
      empathy:"話してくださって、ありがとうございます。うまく言葉にならないところも含めて、今、とても苦しい中にいらっしゃるのだと思います。",
      emotion:"いちど、お子さんのことから少し離れてみます。今、あなた自身の心にいちばん重くのしかかっているのは、どんな気持ちですか。焦り、不安、怒り、疲れ、さみしさ——近いものはありますか。うまく選べなくても大丈夫です。",
      belief:"不登校のお子さんをもつ親御さんの多くが、心のどこかに「親として、ちゃんとしなきゃ」という思いを抱えています。あなたには、そういう思いがありますか。もしあっても、少しもおかしくありません。",
      reframe:"このツールがお伝えしたいのは、「不登校を解決しましょう」ということではありません。あなたが自分の気持ちに気づいて、ほんの少し楽になって、お子さんのとなりに立てるようになること。主人公は、お子さんではなく、あなたです。",
      action:"今日、お子さんのためではなく、あなた自身が少しほっとするためにできそうなことを、ひとつ挙げるとしたら——何でしょう。思いつかなければ、それでも大丈夫です。"
    }
  },

  stepOrder:["empathy","emotion","belief","reframe","action"],
  replyPlaceholder:"",
  replySend:"送る",
  replySkip:"書かずにつづける",
  replyNote:"書いた内容はこの端末の中だけに残り、どこにも送信・保存されません。",
  reflectDoneHeading:"ここまで、どうでしたか",
  againLabel:"もう少し、別のことも考えたい",
  finishLabel:"今日はここまでにする",

  model:{
    linkLabel:"ビリーフ変容モデル",
    heading:"親のビリーフ変容モデル（5段階）",
    intro:"不登校の親の「世界の見方（ビリーフ）」は、時間をかけて次のように変わっていくことが多い、と考えています。いま自分がどのあたりにいるか、決めつけずに眺めてみてください。行ったり戻ったりするのが普通です。",
    stages:[
      { n:"①", belief:"学校に戻すことが親の役目", state:"焦り・不安・自責", events:"付き添い登校、なだめる・励ます・怒る、毎朝の欠席連絡", role:"まず感情を受け止め、状況を整理する" },
      { n:"②", belief:"専門家なら何とかしてくれる（口では「行かなくていい」、心では「行ってほしい」）", state:"疲弊・不信・焦りの持続", events:"病院・カウンセラー・フリースクール探し、情報収集", role:"本音と建前の“ズレ”を、そっと仮説として返す" },
      { n:"③", belief:"学校より命のほうが大切だ（生きていてくれるだけでいい）", state:"恐怖・危機感（身体レベル）", events:"食べなくなる、暴れる、家出する", role:"安全確保を最優先。専門機関・緊急相談へ橋渡し" },
      { n:"④", belief:"変わるべきなのは子どもではなく私だった", state:"気づき・揺らぎ・解放感の芽生え", events:"自分と自分の親との関係を振り返る", role:"問い返しで気づきを深める。責めずに整理する" },
      { n:"⑤", belief:"子どもも私も、自分らしく生きればいい", state:"安心・軽さ・自分の人生への関心", events:"子どものやりたいことを一緒に探す、親も新しいことを始める", role:"変化の継続を支える。親自身の人生へ問いかける" }
    ],
    note:"「出来事」と「ビリーフ」は別のものです。同じ出来事でも、その奥にある見方は人それぞれ違います。",
    backLabel:"はじめの画面にもどる"
  },

  closing:{
    heading:"今日はここまでにしましょう",
    body:[
      "よく、ここまで向き合いましたね。一度にぜんぶ整理しようとしなくて大丈夫です。今日、少しでも自分の気持ちに気づけたなら、それで十分だと思います。",
      "またしんどくなったら、いつでも戻ってきてください。"
    ],
    recapHeading:"今日、あなたが書いたこと",
    recapNote:"この画面をとじると消えます。残したいときは、書き写しておいてください。",
    feedbackLabel:"このツールの応答に違和感があったら、教えてください。少しずつ直していきます。",
    feedbackContact:"office@yu-town.org",
    restartLabel:"もう一度はじめから",
    modelLabel:"ビリーフ変容モデルを見る"
  },

  disclaimer:"※このツールは、NPO法人優タウン・小沼陽子の考え方をもとに、あらかじめ用意された内省の道すじを案内するプログラムです。小沼陽子本人の返信ではなく、AIがその場で会話するものでもありません。医療的な診断・治療は行いません。"
};
/* ▲▲▲ 編集できるのはここまで ▲▲▲ ======================================== */


/* ---------------- 以下は表示の仕組み（通常は編集不要） ---------------- */
const app = document.getElementById('app');
document.getElementById('disc').textContent = CONTENT.disclaimer;
document.getElementById('modelLink').textContent = CONTENT.model.linkLabel;
document.getElementById('utownLink').textContent = CONTENT.utown.heading;

let state = { view:'intro', concern:null, step:0, awaiting:false, transcript:[] };

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function go(view){ state.view = view; render(); window.scrollTo(0,0); }
function showCrisis(fromDetection){ state.crisisFromDetection = !!fromDetection; go('crisis'); }

function checkCrisis(text){
  const t = text.toLowerCase();
  return CONTENT.crisis.triggerWords.some(w => t.includes(String(w).toLowerCase()));
}
function matchConcern(text){
  const t = text.toLowerCase();
  let best=null, bestScore=0;
  for(const c of CONTENT.concerns){
    let s=0;
    for(const k of (c.keywords||[])) if(t.includes(String(k).toLowerCase())) s++;
    if(s>bestScore){ bestScore=s; best=c; }
  }
  return bestScore>0 ? best : null;
}

function startReflect(concern, youText){
  const steps = CONTENT.stepOrder;
  state.concern = concern;
  state.step = 0;
  state.awaiting = true;
  state.transcript = [
    { role:'you', text: youText },
    { role:'bot', text: concern.steps[steps[0]] }
  ];
  go('reflect');
}

function submitReply(text, skipped){
  const steps = CONTENT.stepOrder;
  text = (text || '').trim();
  if(!skipped && text){
    state.transcript.push({ role:'you', text });
    if(checkCrisis(text)){ showCrisis(true); return; }
  }
  if(state.step >= steps.length - 1){
    state.awaiting = false;              // 最後の問いに答えた
  } else {
    state.step++;
    state.transcript.push({ role:'bot', text: state.concern.steps[steps[state.step]] });
    state.awaiting = true;
  }
  render();
  window.scrollTo(0, document.body.scrollHeight);
}

function render(){
  const v = state.view;
  if(v==='intro') return renderIntro();
  if(v==='select') return renderSelect();
  if(v==='own') return renderOwn();
  if(v==='reflect') return renderReflect();
  if(v==='crisis') return renderCrisis();
  if(v==='model') return renderModel();
  if(v==='utown') return renderUtown();
  if(v==='closing') return renderClosing();
}

function utownLinksHtml(){
  return CONTENT.utown.links.map(l=>{
    const isUrl = /^https?:\/\//i.test(l.value);
    return isUrl
      ? `<div class="res"><a class="name" href="${esc(l.value)}" target="_blank" rel="noopener">${esc(l.label)} →</a></div>`
      : `<div class="res"><div class="name">${esc(l.label)}</div><div><span class="note">${esc(l.value)}</span></div></div>`;
  }).join('');
}
function contactHtml(v){
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return `<a href="mailto:${esc(v)}">${esc(v)}</a>`;
  if(/^https?:\/\//i.test(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`;
  return esc(v);
}
function utownBlockHtml(){
  const u = CONTENT.utown;
  return `<h2>${esc(u.heading)}</h2><p>${esc(u.body)}</p>${utownLinksHtml()}`;
}
function renderUtown(){
  app.innerHTML = `
    <div class="card fade">
      ${utownBlockHtml()}
      <button class="btn secondary block" onclick="go('intro')">${esc(CONTENT.utown.backLabel)}</button>
    </div>`;
}

function renderIntro(){
  app.innerHTML = `
    <div class="card fade">
      <h1>${esc(CONTENT.meta.title)}</h1>
      <p class="lead">${esc(CONTENT.meta.subtitle)}</p>
      ${CONTENT.meta.intro.map(p=>`<p>${esc(p)}</p>`).join('')}
      <button class="btn block" onclick="go('select')">${esc(CONTENT.meta.startLabel)}</button>
    </div>`;
}

function renderSelect(){
  app.innerHTML = `
    <div class="card fade">
      <h2>${esc(CONTENT.selectHeading)}</h2>
      <div class="choices">
        ${CONTENT.concerns.map(c=>`<button class="btn block" data-id="${c.id}">${esc(c.label)}</button>`).join('')}
        <button class="btn block secondary" onclick="go('own')">${esc(CONTENT.ownWordsLabel)}</button>
      </div>
    </div>`;
  app.querySelectorAll('button[data-id]').forEach(b=>{
    b.onclick = ()=>{
      const c = CONTENT.concerns.find(x=>x.id===b.dataset.id);
      startReflect(c, c.label);
    };
  });
}

function renderOwn(){
  app.innerHTML = `
    <div class="card fade">
      <h2>${esc(CONTENT.ownWordsPrompt)}</h2>
      <textarea id="ta" placeholder="例）朝は起きてこないのに、夜はずっとゲームをしています。将来を考えると不安で…"></textarea>
      <p class="note">書いた内容はこの端末の中だけで処理され、どこにも送信・保存されません。</p>
      <button class="btn block" id="send">${esc(CONTENT.ownWordsSend)}</button>
      <button class="btn secondary block" onclick="go('select')">もどる</button>
    </div>`;
  app.querySelector('#send').onclick = ()=>{
    const text = app.querySelector('#ta').value.trim();
    if(!text) return;
    if(checkCrisis(text)){ showCrisis(true); return; }
    const c = matchConcern(text) || { id:'generic', steps: CONTENT.generic.steps };
    startReflect(c, text);
  };
}

function renderReflect(){
  const bubbles = state.transcript.map(m => m.role === 'you'
    ? `<p class="who">あなた</p><div class="bubble you fade">${esc(m.text)}</div>`
    : `<p class="who">陽子bot</p><div class="bubble bot fade">${esc(m.text)}</div>`
  );
  let controls;
  if(state.awaiting){
    controls = `
      <textarea id="reply" placeholder="${esc(CONTENT.replyPlaceholder)}"></textarea>
      ${state.step === 0 ? `<p class="note">${esc(CONTENT.replyNote)}</p>` : ''}
      <button class="btn block" id="send">${esc(CONTENT.replySend)}</button>
      <button class="btn secondary block" id="skip">${esc(CONTENT.replySkip)}</button>`;
  } else {
    controls = `
      <p class="who">${esc(CONTENT.reflectDoneHeading)}</p>
      <button class="btn block" onclick="go('select')">${esc(CONTENT.againLabel)}</button>
      <button class="btn secondary block" onclick="go('closing')">${esc(CONTENT.finishLabel)}</button>`;
  }
  app.innerHTML = `
    <div class="card">
      ${bubbles.join('')}
      <div style="margin-top:14px">${controls}</div>
    </div>`;
  if(state.awaiting){
    const ta = app.querySelector('#reply');
    app.querySelector('#send').onclick = ()=> submitReply(ta.value, false);
    app.querySelector('#skip').onclick = ()=> submitReply('', true);
    ta.addEventListener('keydown', e=>{
      if((e.metaKey || e.ctrlKey) && e.key === 'Enter') submitReply(ta.value, false);
    });
    ta.focus();
  }
}

function renderCrisis(){
  const c = CONTENT.crisis;
  const body = state.crisisFromDetection ? c.body : c.bodyCalm;
  app.innerHTML = `
    <div class="card fade" style="border-color:var(--accent)">
      <h1>${esc(c.heading)}</h1>
      ${body.map(p=>`<p>${esc(p)}</p>`).join('')}

      <p style="font-weight:700;margin-top:18px">${esc(c.utownNote)}</p>
      ${utownLinksHtml()}
      <button class="btn secondary block" onclick="go('utown')">${esc(CONTENT.utown.heading)}</button>

      <p class="note" style="margin-top:22px">${esc(c.emergencyNote)}</p>
      <div>
        ${c.resources.map(r=>`
          <div class="res">
            <div class="name">${esc(r.name)}</div>
            <div class="contact"><a href="tel:${esc(r.tel)}">${esc(r.contact)}</a></div>
            <div class="note">${esc(r.note)}</div>
          </div>`).join('')}
      </div>

      <button class="btn secondary block" onclick="go('intro')">${esc(c.backLabel)}</button>
    </div>`;
}

function renderModel(){
  const m = CONTENT.model;
  app.innerHTML = `
    <div class="card fade">
      <h1>${esc(m.heading)}</h1>
      <p class="lead">${esc(m.intro)}</p>
      ${m.stages.map(s=>`
        <div class="model-stage">
          <p><span class="n">${esc(s.n)}</span>　${esc(s.belief)}</p>
          <p class="k">親の状態：${esc(s.state)}</p>
          <p class="k">代表的な出来事：${esc(s.events)}</p>
          <p class="k">このツールの関わり方：${esc(s.role)}</p>
        </div>`).join('')}
      <p class="note">${esc(m.note)}</p>
      <button class="btn secondary block" onclick="go('intro')">${esc(m.backLabel)}</button>
    </div>`;
}

function renderClosing(){
  const c = CONTENT.closing;
  const written = state.transcript.filter(m => m.role === 'you').map(m => m.text);
  const recap = written.length ? `
      <h2>${esc(c.recapHeading)}</h2>
      ${written.map(t=>`<div class="bubble you">${esc(t)}</div>`).join('')}
      <p class="note">${esc(c.recapNote)}</p>` : '';
  app.innerHTML = `
    <div class="card fade">
      <h1>${esc(c.heading)}</h1>
      ${c.body.map(p=>`<p>${esc(p)}</p>`).join('')}
      ${recap}
      <div style="margin-top:20px;padding-top:4px;border-top:1px solid var(--line)">
        ${utownBlockHtml()}
      </div>
      <p class="note">${esc(c.feedbackLabel)}<br>${contactHtml(c.feedbackContact)}</p>
      <button class="btn block" onclick="restart()">${esc(c.restartLabel)}</button>
    </div>`;
}

function restart(){ state = { view:'intro', concern:null, step:0, awaiting:false, transcript:[] }; render(); window.scrollTo(0,0); }

render();
</script>
